<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Player - Tic-Tac-Toe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/game.css">
</head>
<body>
    <div class="game-box">
        <div class="header-nav">
            <a href="index.html" class="back-btn"><i class="fa fa-arrow-left"></i> Home</a>
        </div>
        <div class="message">
            <p>Player X's turn</p>
        </div>
        <div class="tictactoe">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>

        <button id="reset">Reset Game</button>
    </div>

    <script src="assets/js/winner.js"></script>
    <script src="assets/js/game.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            window.gameInstance = new TwoPlayer();
        });
    </script>
</body>
</html>
